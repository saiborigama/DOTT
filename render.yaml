databases:
  - name: dott-db
    plan: free
    databaseName: dott
    user: dott

services:
  - type: web
    name: dott-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://dott-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: dott-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:5173,https://dott-customer.onrender.com,https://dott-vendor.onrender.com,https://dott-rider.onrender.com,https://dott-admin.onrender.com
      - key: CORS_ORIGIN_REGEX
        value: ^https://.*\.onrender\.com$
      - key: DOTT_SEED_DEMO
        value: "1"
      - key: OTP_EMAIL_HOST
        value: smtp.gmail.com
      - key: OTP_EMAIL_PORT
        value: "587"
      - key: OTP_EMAIL_USER
        sync: false
      - key: OTP_EMAIL_PASSWORD
        sync: false
      - key: OTP_EMAIL_FROM
        sync: false
      - key: OTP_EMAIL_FROM_NAME
        value: DOTT Updates
      - key: OTP_EMAIL_USE_TLS
        value: "true"
  - type: static
    name: dott-customer
    rootDir: customer
    buildCommand: npm ci && npm rebuild esbuild && node ./node_modules/vite/bin/vite.js build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://dott-backend.onrender.com/api
  - type: static
    name: dott-vendor
    rootDir: vendor
    buildCommand: npm ci && npm rebuild esbuild && node ./node_modules/vite/bin/vite.js build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://dott-backend.onrender.com/api
